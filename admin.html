<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Administration</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" href="data:," />
</head>
<body data-title="Administration">
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark" data-brand-mark>B</div>
      <span class="brand-name" data-brand>Bank</span>
    </div>
    <div class="topbar-actions">
      <span id="adminName" class="user-name"></span>
      <button class="btn btn-secondary btn-sm" id="logoutBtn" type="button">Sign out</button>
    </div>
  </header>

  <main class="container wide">
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-tab="customers" aria-selected="true" type="button">Customers</button>
      <button class="tab" role="tab" data-tab="transactions" aria-selected="false" type="button">Transactions</button>
      <button class="tab" role="tab" data-tab="messages" aria-selected="false" type="button">Error messages</button>
      <button class="tab" role="tab" data-tab="limits" aria-selected="false" type="button">Limits</button>
    </div>

    <section data-panel="customers" class="grid-gap">
      <div class="card">
        <div class="section-header">
          <h2>Customers</h2>
          <button class="btn btn-sm" id="addCustomerBtn" type="button">+ Add customer</button>
        </div>
        <div id="customersList"></div>
      </div>
    </section>

    <section data-panel="transactions" hidden class="grid-gap">
      <div class="card">
        <div class="section-header">
          <h2>All transactions</h2>
          <button class="btn btn-sm" id="addTransactionBtn" type="button">+ Add transaction</button>
        </div>
        <div id="transactionsList"></div>
      </div>
    </section>

    <section data-panel="messages" hidden>
      <div class="card">
        <div class="section-header">
          <h2>Error message types</h2>
          <button class="btn btn-sm" id="addMessageBtn" type="button">+ Add message type</button>
        </div>
        <div id="messagesList"></div>
      </div>
    </section>

    <section data-panel="limits" hidden>
      <div class="card">
        <div class="section-header"><h2>Transfer limits</h2></div>
        <form id="limitsForm" class="form" novalidate>
          <div class="row">
            <div class="field">
              <label for="singleLimit">Per transfer (EUR)</label>
              <input type="text" id="singleLimit" inputmode="decimal" required />
            </div>
            <div class="field">
              <label for="dailyLimit">Per rolling 24 hours (EUR)</label>
              <input type="text" id="dailyLimit" inputmode="decimal" required />
            </div>
          </div>
          <div id="limitsError" class="alert error" role="alert" hidden></div>
          <div><button class="btn" type="submit">Save limits</button></div>
        </form>
      </div>
    </section>
  </main>

  <dialog id="customerDialog" aria-labelledby="customerDialogTitle">
    <div class="dlg-body">
      <h3 id="customerDialogTitle">Customer</h3>
      <form id="customerForm" class="form" novalidate>
        <input type="hidden" id="customerId" />
        <div class="field">
          <label for="customerName">Name</label>
          <input type="text" id="customerName" required maxlength="80" />
        </div>
        <div class="field">
          <label for="customerAccount">Account number</label>
          <input type="text" id="customerAccount" inputmode="numeric" maxlength="24" />
        </div>
        <div class="field">
          <label for="customerPassword">Password (leave empty to auto-generate)</label>
          <input type="text" id="customerPassword" autocomplete="new-password" />
        </div>
        <div class="field">
          <label for="customerStatus">Status</label>
          <select id="customerStatus">
            <option value="active">Active</option>
            <option value="blocked">Blocked</option>
          </select>
        </div>
        <div id="customerError" class="alert error" role="alert" hidden></div>
      </form>
    </div>
    <div class="dlg-foot">
      <button type="button" class="btn btn-secondary" id="customerCancelBtn">Cancel</button>
      <button type="button" class="btn" id="customerSaveBtn">Save</button>
    </div>
  </dialog>

  <script src="js/config.js"></script>
  <script src="js/store.js"></script>
  <script src="js/api.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
